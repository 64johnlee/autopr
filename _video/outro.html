<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<title>AutoPR</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,monospace;
       background:#0d1117;color:#e6edf3;height:100vh;display:flex;
       align-items:center;justify-content:center;overflow:hidden}
  .wrap{text-align:center;animation:rise 1s ease-out}
  h1{font-size:3.4rem;font-weight:800;color:#58a6ff}
  .grid{display:flex;gap:1rem;justify-content:center;margin-top:2rem}
  .stat{background:#161b22;border:1px solid #30363d;border-radius:8px;padding:1.1rem 1.6rem;min-width:140px}
  .stat .val{font-size:2.2rem;font-weight:700;color:#58a6ff}
  .stat.earned .val{color:#3fb950}
  .stat .label{font-size:.85rem;color:#8b949e;margin-top:.3rem}
  .arch{margin-top:2.2rem;font-size:1.05rem;color:#8b949e;line-height:1.8}
  .arch b{color:#d29922}
  .repo{margin-top:2rem;font-size:1.15rem;color:#e6edf3;font-family:monospace}
  .repo span{color:#58a6ff}
  .hack{margin-top:1.4rem;font-size:.95rem;color:#8b949e}
  @keyframes rise{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<div class="wrap">
  <h1>AutoPR</h1>
  <div class="grid">
    <div class="stat"><div class="val">47</div><div class="label">Attempts</div></div>
    <div class="stat"><div class="val">12</div><div class="label">Merged PRs</div></div>
    <div class="stat earned"><div class="val">$680</div><div class="label">Earned</div></div>
    <div class="stat"><div class="val">~$8/mo</div><div class="label">ECS cost</div></div>
  </div>
  <div class="arch"><b>Qwen-Max</b> for judgment · <b>Qwen-Plus</b> for code · <b>Alibaba Cloud</b> for the loop</div>
  <div class="repo">github.com/<span>64johnlee/autopr</span></div>
  <div class="hack">Qwen Cloud Global AI Hackathon 2026 · Autopilot Agent track</div>
</div>
</body>
</html>
