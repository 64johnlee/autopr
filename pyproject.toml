[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "autopr"
version = "0.1.0"
description = "Autonomous agent that finds open-source bounties, writes fixes, and submits PRs"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "openai>=1.30.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "httpx>=0.27.0",
    "rich>=13.0.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "anyio>=4.0.0",
    "aiofiles>=23.0.0",
    "sse-starlette>=1.8.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-asyncio>=0.23"]

[project.scripts]
autopr = "autopr.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["autopr"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
